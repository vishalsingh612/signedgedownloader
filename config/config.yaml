    results_container: .table-responsive
    row_download_icon: a[download], a svg, button:has(svg), td:last-child a, td:last-child
      button
    row_selector: table tbody tr
  login:
    dashboard_indicator: a[href*='logout'], .user-profile, .dashboard
    email_input: input#floatingInput1
    password_input: input#floatingInput2
    submit_button: button:has-text('LOGIN')
  navigation:
    playback_link: text=Content Playback
    reports_menu: li.nav-item:has-text('Reports') .nav-link
  playback:
    campaign_dropdown: input#react-select-5-input
    date_end_input: input[placeholder='To Date*']
    date_start_input: input[placeholder='From Date*']
    device_dropdown: input#react-select-2-input
    search_button: button:has-text('Search'), input[type='button'][value='Search'],
      input[type='submit'][value='Search']
